<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMULA 1 — DRIVER POV</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090e;color:white;font:15px Arial,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh}.screen{position:fixed;inset:0;background:#07080de9;display:grid;place-items:center;z-index:3}.hidden{display:none!important}.panel{width:min(94vw,470px);max-height:90vh;overflow:auto;text-align:center;background:#11141b;border:2px solid #fa304c;padding:24px;border-radius:12px}h1{font-style:italic;color:#fa304c;font-size:44px}p{color:#b7b9c5}input,select,button{width:100%;padding:12px;margin:6px 0;background:#242735;border:1px solid #59606a;color:white;border-radius:6px}button{background:#ef304c;border:0;font-weight:bold;cursor:pointer}.line{display:flex;gap:8px}.line>*{flex:1;min-width:0}.member{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #444}#roomCode{font-size:34px;letter-spacing:6px;color:#ff4b64}.hud{position:fixed;inset:0;pointer-events:none}.tile{position:absolute;padding:12px;background:#07090edb;border-left:4px solid #f34;min-width:130px}.tl{top:15px;left:15px}.tr{top:15px;right:15px;text-align:right}.br{bottom:15px;right:15px;text-align:right}#speed{font-size:42px;font-weight:bold}#count{position:absolute;top:30%;width:100%;font-size:95px;font-weight:bold;text-align:center;color:#ff344e;text-shadow:0 3px 12px black}#warning{position:absolute;top:18%;width:100%;text-align:center;color:#ffd64c;font-weight:bold;font-size:23px}#pit{pointer-events:auto;position:absolute;bottom:15px;left:50%;transform:translateX(-50%);width:180px;display:none}#mini{position:absolute;bottom:15px;left:15px;width:165px;height:165px;background:#07090edb;border:1px solid #fa304c}.result{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #444}
</style></head><body><canvas id="game"></canvas>
<section id="menu" class="screen"><div class="panel"><p>REAL DRIVER POV · MANUAL STEERING</p><h1>FORMULA 1</h1><p>YOUR LINE. YOUR BRAKING. YOUR RACE.</p><input id="name" value="DRIVER" maxlength="16" placeholder="DRIVER NAME"><select id="color"><option value="#ff3048">RED</option><option value="#318aff">BLUE</option><option value="#ffd43b">YELLOW</option><option value="#aa72ff">PURPLE</option><option value="#f0f0f0">WHITE</option><option value="#ff8b2b">ORANGE</option></select><button id="create">CREATE ROOM</button><div class="line"><input id="codeInput" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN ROOM</button></div><p id="status">Connecting to server...</p><p>W / ↑ ACCELERATE · S / ↓ BRAKE<br>A / ← LEFT · D / → RIGHT</p></div></section>
<section id="lobby" class="screen hidden"><div class="panel"><h1>RACE LOBBY</h1><div id="roomCode"></div><button id="copy">COPY CODE</button><div id="members"></div><button id="ready">READY</button><button id="start">START RACE</button></div></section>
<div id="hud" class="hud hidden"><div class="tile tl"><b>FORMULA 1</b><div id="lap">LAP 1 / 3</div><div id="rank">P1 / 1</div><div id="sector">MAIN STRAIGHT</div></div><div class="tile tr"><div>RACE TIME</div><h2 id="timer">0:00.000</h2><div id="flag">GREEN FLAG</div></div><div class="tile br"><div id="speed">0</div>KM/H</div><div id="count"></div><div id="warning"></div><canvas id="mini" width="200" height="200"></canvas><button id="pit">PIT STOP</button></div>
<section id="results" class="screen hidden"><div class="panel"><h1>RACE RESULTS</h1><div id="resultsList"></div><button onclick="location.reload()">BACK TO MENU</button></div></section>
<script src="/socket.io/socket.io.js"></script><script src="/track.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),mc=$('mini').getContext('2d');let W,H,room=null,myId=null,keys={},lastMsg='',msgUntil=0;function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',resize);resize();function show(id){['menu','lobby','hud','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function fmt(t){return Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0')}if(typeof F1Track==='undefined'||typeof io==='undefined'){$('status').textContent='Server or track.js connection error';return}const socket=io();socket.on('connect',()=>{$('status').textContent='SERVER CONNECTED'});socket.on('connect_error',()=>{$('status').textContent='SERVER CONNECTION FAILED'});socket.on('errorMsg',alert);socket.on('notice',t=>{lastMsg=t;msgUntil=Date.now()+4000});socket.on('joined',d=>{myId=d.id;$('roomCode').textContent=d.code;show('lobby')});socket.on('room',r=>{room=r;if(r.state==='lobby'){show('lobby');$('members').replaceChildren();r.players.forEach(p=>{const row=document.createElement('div');row.className='member';const n=document.createElement('span');n.textContent=p.name;n.style.color=p.color;const state=document.createElement('span');state.textContent=p.ready?'READY':'WAITING';row.append(n,state);$('members').append(row)});$('start').style.display=r.host===myId?'block':'none';$('ready').textContent=r.players.find(p=>p.id===myId)?.ready?'CANCEL READY':'READY'}else if(r.state==='countdown'||r.state==='racing')show('hud');else if(r.state==='results'){show('results');$('resultsList').replaceChildren();r.results.forEach((p,i)=>{const row=document.createElement('div');row.className='result';const n=document.createElement('span');n.textContent=`P${i+1} ${p.name}`;const t=document.createElement('b');t.textContent=p.dnf?'DNF':fmt(p.total);row.append(n,t);$('resultsList').append(row)})}});
$('create').onclick=()=>socket.emit('create',{name:$('name').value,color:$('color').value});$('join').onclick=()=>socket.emit('join',{code:$('codeInput').value,name:$('name').value,color:$('color').value});$('ready').onclick=()=>socket.emit('ready');$('start').onclick=()=>socket.emit('start');$('pit').onclick=()=>socket.emit('pit');$('copy').onclick=()=>navigator.clipboard?.writeText($('roomCode').textContent);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>keys={});setInterval(()=>{if(room?.state==='racing')socket.emit('input',{gas:!!(keys.w||keys.arrowup),brake:!!(keys.s||keys.arrowdown),steer:Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft))})},50);
// Driver POV camera: project actual world coordinates into the car's heading.
// The track is fixed in the world; steering changes the camera, NOT the track.
const ROAD=40,L=F1Track.LENGTH,points=Array.from({length:1200},(_,i)=>F1Track.pos(i*L/1200));const ext={minX:Math.min(...points.map(p=>p.x)),maxX:Math.max(...points.map(p=>p.x)),minY:Math.min(...points.map(p=>p.y)),maxY:Math.max(...points.map(p=>p.y))};function project(p,car){const dx=p.x-car.x,dy=p.y-car.y,c=Math.cos(car.heading),s=Math.sin(car.heading),forward=dx*c+dy*s,lateral=-dx*s+dy*c;if(forward<1)return null;const horizon=H*.40,focal=W*.95;return{x:W/2+lateral*focal/(forward+65),y:horizon+H*.55*105/(forward+105),depth:forward}}
function road(){const self=room?.players.find(p=>p.id===myId);const active=room?.players.filter(p=>!p.dnf)||[];const car=(self?.dnf&&active.length?active[0]:self)||{x:points[0].x,y:points[0].y,heading:F1Track.direction(0),dist:0,speed:0,lane:0};ctx.fillStyle='#a7c7e4';ctx.fillRect(0,0,W,H*.42);ctx.fillStyle='#315d35';ctx.fillRect(0,H*.42,W,H*.58);ctx.fillStyle='#7b91a0';ctx.beginPath();ctx.moveTo(0,H*.42);for(let x=0;x<=W;x+=30)ctx.lineTo(x,H*.40-16*Math.sin(x*.015));ctx.lineTo(W,H*.42);ctx.fill();
 // Draw road as perspective polygons, using track samples projected from the real car.
 const segments=[];for(let i=0;i<1200;i++){const a=points[i],b=points[(i+1)%1200],d=i*L/1200,dir=F1Track.direction(d),dir2=F1Track.direction(d+L/1200),na={x:-Math.sin(dir),y:Math.cos(dir)},nb={x:-Math.sin(dir2),y:Math.cos(dir2)};const centerA=project(a,car),centerB=project(b,car);if(!centerA||!centerB||centerA.depth>1250||centerB.depth>1250||Math.abs(centerA.depth-centerB.depth)>250)continue;const edge=(p,n,sign)=>project({x:p.x+n.x*ROAD*sign,y:p.y+n.y*ROAD*sign},car);const aL=edge(a,na,-1),aR=edge(a,na,1),bL=edge(b,nb,-1),bR=edge(b,nb,1);if(aL&&aR&&bL&&bR)segments.push({d,depth:(centerA.depth+centerB.depth)/2,poly:[aL,aR,bR,bL],centerA,centerB})}segments.sort((a,b)=>b.depth-a.depth);function fill(poly,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath();ctx.fill()}
 for(const s of segments){fill(s.poly,'#34363c');const [al,ar,br,bl]=s.poly;const kerb=(p,q,t)=>({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t});fill([al,kerb(al,ar,.09),kerb(bl,br,.09),bl],Math.floor(s.d/45)%2?'#fff':'#e92c48');fill([kerb(al,ar,.91),ar,br,kerb(bl,br,.91)],Math.floor(s.d/45)%2?'#fff':'#e92c48');if(Math.floor(s.d/28)%3===0){ctx.strokeStyle='#ffffff6b';ctx.lineWidth=Math.max(1,3/(s.depth/200+1));ctx.beginPath();ctx.moveTo(s.centerA.x,s.centerA.y);ctx.lineTo(s.centerB.x,s.centerB.y);ctx.stroke()}}
 // Other players in world space, not snapped to the road.
 for(const p of room?.players||[]){if(p.id===myId||p.dnf)continue;const q=project(p,car);if(!q||q.depth>800)continue;const w=Math.max(5,550/(q.depth+40));ctx.fillStyle=p.color;ctx.fillRect(q.x-w/2,q.y-w*1.4,w,w*1.4);ctx.fillStyle='white';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(p.name,q.x,q.y-w*1.6)}
 // Cockpit and steering wheel fixed to the driver's POV.
 ctx.fillStyle='#151820';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.90);ctx.lineTo(W*.31,H*.93);ctx.lineTo(W*.41,H*.80);ctx.lineTo(W*.59,H*.80);ctx.lineTo(W*.69,H*.93);ctx.lineTo(W,H*.90);ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#db2843';ctx.fillRect(W*.39,H*.81,W*.22,H*.028);ctx.strokeStyle='#101114';ctx.lineWidth=Math.max(14,W*.018);ctx.beginPath();ctx.ellipse(W/2,H*.98,W*.13,H*.115,0,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#f5f5f5';ctx.fillRect(W*.494,H*.867,W*.012,H*.015);
 if(room?.state==='racing'||room?.state==='countdown'){const rank=[...room.players].sort((a,b)=>b.dist-a.dist);$('lap').textContent=`LAP ${Math.min(3,1+Math.floor((self?.dist||0)/L))} / 3`;$('rank').textContent=`P${rank.findIndex(p=>p.id===myId)+1} / ${rank.length}`;$('sector').textContent=F1Track.label(car.dist);$('speed').textContent=Math.round((self?.speed||0)*3.6);$('timer').textContent=fmt(Math.max(0,(Date.now()-room.startAt)/1000));$('flag').textContent=room.flag==='safety'?'⚠ SAFETY CAR':'GREEN FLAG';$('count').textContent=room.state==='countdown'?Math.max(1,Math.ceil((room.startAt-Date.now())/1000)):(Date.now()-room.startAt<800?'GO!':'');$('warning').textContent=self?.dnf?'DNF · SPECTATING':Math.abs(self?.lane||0)>1?'⚠ OFF TRACK':Date.now()<msgUntil?lastMsg:'';$('pit').style.display=room.flag==='safety'&&!self?.dnf&&!self?.finished&&!self?.pitUsed?'block':'none';drawMini()}}
 function drawMini(){mc.clearRect(0,0,200,200);const scale=Math.min(166/(ext.maxX-ext.minX),166/(ext.maxY-ext.minY)),mx=(ext.maxX+ext.minX)/2,my=(ext.maxY+ext.minY)/2;const mp=p=>({x:100+(p.x-mx)*scale,y:100+(p.y-my)*scale});mc.strokeStyle='#eee';mc.lineWidth=3;mc.beginPath();points.forEach((p,i)=>{const q=mp(p);if(!i)mc.moveTo(q.x,q.y);else mc.lineTo(q.x,q.y)});mc.closePath();mc.stroke();for(const p of room.players){const q=mp(p);mc.fillStyle=p.color;mc.beginPath();mc.arc(q.x,q.y,p.id===myId?5:3,0,Math.PI*2);mc.fill()}}
 function frame(){requestAnimationFrame(frame);road()}requestAnimationFrame(frame);
})();
</script></body></html>
